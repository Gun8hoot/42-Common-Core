# General settings
listen=YES
listen_ipv6=NO

# Anonymous access (disable if not needed)
anonymous_enable=NO

# Local user access
local_enable=YES
write_enable=YES
local_umask=022

# Security
ssl_enable=YES
rsa_cert_file=/var/ftp/cert/vsftpd.crt
rsa_private_key_file=/var/ftp/cert/vsftpd.key
force_local_logins_ssl=NO
force_local_data_ssl=NO
require_ssl_reuse=NO
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
allow_anon_ssl=NO

# Passive mode
pasv_enable=YES
pasv_min_port=10000
pasv_max_port=10100

# User restrictions
chroot_local_user=YES
allow_writeable_chroot=YES

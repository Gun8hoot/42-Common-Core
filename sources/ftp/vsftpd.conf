
listen=YES
listen_ipv6=NO

# Local user access
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

local_root=/srv/ftp

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# TLS (Explicit FTPS via AUTH TLS)
anonymous_enable=NO
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES

# Use Let’s Encrypt paths if obtained; otherwise use self-signed
rsa_cert_file=/run/secrets/vsftpd.crt
rsa_private_key_file=/run/secrets/vsftpd.key

# TLS hardening
ssl_tlsv1=NO
ssl_tlsv1_1=NO
ssl_tlsv1_2=YES
require_ssl_reuse=NO
ssl_ciphers=HIGH

# Logging
xferlog_std_format=NO
log_ftp_protocol=YES

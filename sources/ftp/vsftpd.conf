# --- BASIC ---
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

local_root=/srv/ftp
chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO

# --- PASSIVE MODE ---
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
port_enable=NO

# --- TLS ---
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=NO
ssl_tlsv1=YES
rsa_cert_file=/run/secrets/vsftpd.crt
rsa_private_key_file=/run/secrets/vsftpd.key

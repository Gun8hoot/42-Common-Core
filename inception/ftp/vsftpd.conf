# --- BASIC ---
listen=YES
port_enable=NO
connect_from_port_20=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

local_root=/srv/ftp
chroot_local_user=YES
allow_writeable_chroot=YES
seccomp_sandbox=NO

# --- PASSIVE MODE ---
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=127.0.0.1

# --- TLS ---
ssl_enable=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
force_local_data_ssl=NO
force_local_logins_ssl=NO
ssl_ciphers=HIGH
require_ssl_reuse=NO
rsa_cert_file=/run/secrets/vsftpd.crt
rsa_private_key_file=/run/secrets/vsftpd.key

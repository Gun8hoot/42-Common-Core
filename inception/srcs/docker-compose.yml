services:
    # ========== MENDATORY PART ==========
    nginx:
        container_name: inception-nginx
        image: inception-nginx:1.0
        build:
            context: ./nginx
            dockerfile: Dockerfile
        ports:
            - 80:80
            - 443:443
        secrets:
            - nginx.crt
            - nginx.key
        restart: on-failure:5
        networks:
            - MainNet
        volumes:
            - wordpress_data:/srv/www/wordpress
            - adminer_page:/var/www/adminer/
            - logs:/var/log/nginx
        depends_on:
            - wordpress
            - adminer
            - kuma
    mariadb:
        container_name: inception-mariadb
        image: inception-mariadb:1.0
        build:
            context: ./mariadb
            dockerfile: Dockerfile
        networks:
            - DBNetwork
        restart: on-failure:5
        volumes:
            - db:/var/lib/mysql
            - logs:/var/logs/mariadb
        secrets:
            - SC_MARIADB_ROOT_PASSWORD
            - SC_WORDPRESS_DB_USER
            - SC_WORDPRESS_DB_PASSWORD
            - SC_KUMA_DB_USER
            - SC_KUMA_DB_PASSWORD
    wordpress:
        container_name: inception-wordpress
        image: inception-wordpress:1.0
        build:
            context: ./wordpress
            dockerfile: Dockerfile
        networks:
            - MainNet
            - DBNetwork
            - RedisNetwork
        secrets:
            - SC_WORDPRESS_DB_USER
            - SC_WORDPRESS_DB_PASSWORD
        restart: on-failure:5
        volumes:
            - wordpress_data:/srv/www/wordpress
        depends_on:
            - mariadb

    # ========== BONUS PART ==========
    ftp:
        container_name: inception-ftp
        image: inception-ftp:1.0
        build:
            context: ./ftp
            dockerfile: Dockerfile
        ports:
            - "21:21"
            - "40000-40100:40000-40100"
        volumes:
            - wordpress_data:/srv/ftp
        secrets:
            - vsftpd.crt
            - vsftpd.key
            - SC_FTP_PWD
        restart: on-failure:5
        networks:
            - MainNet
        depends_on:
            - wordpress
    adminer:
        container_name: inception-adminer
        image: inception-adminer:1.0
        build:
            context: ./adminer
            dockerfile: Dockerfile
        volumes:
            - adminer_page:/var/www/adminer/
        restart: on-failure:5
        networks:
            - MainNet
            - DBNetwork
        depends_on:
            - mariadb
    redis:
        image: inception-redis:1.0
        container_name: inception-redis
        build:
            context: ./redis
            dockerfile: Dockerfile
        networks:
            - RedisNetwork
        restart: on-failure:5
        depends_on:
            - wordpress
    kuma:
        container_name: inception-kuma
        image: inception-kuma:1.0
        build:
            context: ./kuma
            dockerfile: Dockerfile
        networks:
            - MainNet
            - DBNetwork
        restart: on-failure:5
        depends_on:
            - wordpress

secrets:
    # ========== FILES ==========
    # -- SFTP TLS CERTIFICATE --
    vsftpd.crt:
        file: ../secret/cert/vsftpd.crt
    vsftpd.key:
        file: ../secret/cert/vsftpd.key
    # -- HTTPS TLS CERTIFICATE --
    nginx.key:
        file: ../secret/cert/nginx.key
    nginx.crt:
        file: ../secret/cert/nginx.crt
    # =========== ENV ===========
    SC_FTP_PWD:
        environment: FTP_USER_PASSWORD
    SC_MARIADB_ROOT_PASSWORD:
        environment: MARIADB_ROOT_PASSWORD
    SC_WORDPRESS_DB_USER:
        environment: WORDPRESS_DB_USER
    SC_WORDPRESS_DB_PASSWORD:
        environment: WORDPRESS_DB_PASSWORD
    SC_KUMA_DB_USER:
        environment: KUMA_DB_USER
    SC_KUMA_DB_PASSWORD:
        environment: KUMA_DB_PASSWORD
    SC_WORDPRESS_AUTH_PASSWORD:
        environment: WORDPRESS_AUTH_PASSWORD
    WORDPRESS_SALT_PASSWORD:
        environment: WORDPRESS_SALT_PASSWORD

volumes:
    db:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: $HOME/data/mariadb
    wordpress_data:
        driver: local
        driver_opts:
            type: none
            o: bind, ro
            device: $HOME/data/wordpress
    adminer_page:
        driver: local
        driver_opts:
            type: none
            o: bind, ro
            device: $HOME/data/adminer
    logs:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: $HOME/data/logs

networks:
    MainNet:
        driver: bridge
    DBNetwork: {internal: true}
    RedisNetwork: {internal: true}
    WPNetwork: {internal: true}

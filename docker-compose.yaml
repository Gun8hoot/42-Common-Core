services:
    ftp:
        build:
            context: ./sources/ftp
            args:
                - FTP_PASSWORD=${FTP_PASSWORD}
        ports:
            - 0.0.0.0:20-21:20-21
            - 0.0.0.0:40000-40100:40000-40100
        volumes:
            - $HOME/data/ftp:/srv/ftp # NEED TO CHANGE, BIND MOUNT NOT ALLOW
        secrets:
            - vsftpd.crt
            - vsftpd.key
        restart: always
        networks:
            - MainNet
    nginx:
        build:
            context: ./sources/nginx
        ports:
            - 0.0.0.0:80:80
            - 0.0.0.0:443:443
        secrets:
            - nginx.crt
            - nginx.key
        restart: always
        network_mode: bridge
    # wordpress:
    #     build:
    #         context: ./sources/wordpress
    #     depends_on: mariadb
    #     networks:
    #         MainNet:
    #             ipv4_address: 10.0.0.1
    mariadb:
        build:
            context: ./sources/mariadb
        ports:
            - 3306:3306
        network_mode: host
        # networks:
        #     MainNet:
        #         ipv4_address: 10.0.0.3
        volumes:
            - db:/var/lib/mysql
        environment:
            - MARIADB_USER=${MARIADB_USERNAME}
            - MARIADB_PASSWD=${MARIADB_PASSWORD}
            - MARIADB_DOMAIN=${MARIADB_DOMAIN}

secrets:
    vsftpd.crt:
        file: ./sources/ftp/.secret/vsftpd.crt
    vsftpd.key:
        file: ./sources/ftp/.secret/vsftpd.key
    nginx.key:
        file: ./sources/nginx/.secret/nginx.key
    nginx.crt:
        file: ./sources/nginx/.secret/nginx.crt

volumes:
    db:
    wordpress_data:

networks:
    MainNet:
        driver: bridge
        driver_opts:
            com.docker.network.bridge.name: inception_internal
        ipam:
            config:
                - subnet: 10.0.0.0/28

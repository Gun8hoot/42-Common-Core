services:
    ftp:
        build:
            context: ./sources/ftp
            args:
                - FTP_PASSWORD=${FTP_PASSWORD}
        ports:
            - 0.0.0.0:20-21:20-21
            - 0.0.0.0:40000-40100:40000-40100
        volumes:
            - $HOME/data/ftp:/srv/ftp # NEED TO CHANGE, BIND MOUNT NOT ALLOW
        secrets:
            - vsftpd.crt
            - vsftpd.key
        restart: always
    nginx:
        build:
            context: ./sources/nginx
        ports:
            - 0.0.0.0:80:80
            - 0.0.0.0:443:443
        secrets:
            - nginx.crt
            - nginx.key
        restart: always
        network_mode: bridge
    # wordpress:
    #   build:
    #     context: ./sources/wordpress
    #   depends_on: mariadb
    mariadb:
        build:
            context: ./sources/mariadb
        ports:
            - 3306:3306
        network_mode: host
        volumes:
            - db:/var/lib/mysql
        environment:
            - MARIADB_USER=${MARIADB_USERNAME}
            - MARIADB_PASSWD=${MARIADB_PASSWORD}
            - MARIADB_DOMAIN=${MARIADB_DOMAIN}

secrets:
    vsftpd.crt:
        file: ./sources/ftp/.secret/vsftpd.crt
    vsftpd.key:
        file: ./sources/ftp/.secret/vsftpd.key
    nginx.key:
        file: ./sources/nginx/.secret/nginx.key
    nginx.crt:
        file: ./sources/nginx/.secret/nginx.crt

volumes:
    db:
    wordpress_data:

networks:
    internal-network:
        driver: none

services:
  ftp:
    build:
      context: ./sources/ftp
      args:
        - FTP_PASSWORD=${FTP_PASSWORD}
    ports:
      - 0.0.0.0:20-21:20-21
      - 0.0.0.0:40000-40100:40000-40100
    volumes:
      - /srv/ftp:/srv/ftp
    secrets:
      - vsftpd.crt
      - vsftpd.key
  mariadb:
    build:
      context: ./sources/mariadb
    ports:
      - 3306:3306
    networks:
      - internal-network

secrets:
  vsftpd.crt:
    file: ./sources/ftp/.secret/vsftpd.crt
  vsftpd.key:
    file: ./sources/ftp/.secret/vsftpd.key
  https-certificate:
    file: ./sources/nginx/.secret

volumes:
  db:

networks:
  isolated:
    driver: bridge
  internal-network:

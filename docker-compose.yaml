services:
    ftp:
        build: ./sources/ftp
        port:
            - 20:21
            - 4000-4100
        volumes:
          - db-ftp:/srv/ftp
        secrets:
            - ftps-certificate
volumes:
    db-ftp:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /srv/ftp

secrets:
    ftps-certificate:
        file: ./sources/ftp/.secret
    https-certificate:
        file: ./sources/nginx/.secret
